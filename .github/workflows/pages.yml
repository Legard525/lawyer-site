# Builds the site with the latest posts from the Telegram channel and deploys
# it to GitHub Pages (repo Settings → Pages → Source: "GitHub Actions").
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"   # hourly, to pick up new Telegram posts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # for the keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3
      # Last good Telegram fetch: used when Telegram is unreachable, so site
      # changes still deploy. Restores the newest tg-* entry.
      - uses: actions/cache/restore@v4
        with:
          path: .tg-cache
          key: tg-none
          restore-keys: tg-
      - run: python tools/tg_mirror.py --out _site --cache .tg-cache
      # Keyed by content, so a new entry is stored only when the posts change
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .tg-cache
          key: tg-${{ hashFiles('.tg-cache/posts.json') }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub pauses scheduled workflows in repos with no activity for 60 days.
      # Re-enabling this workflow through the API restarts that clock.
      - name: Keep the hourly schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
